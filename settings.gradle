pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'Sky2M-Clipping'

// One shared source tree (src/), built once per Minecraft version. Each versions/<mc> folder has that version's
// gradle.properties and, if ever needed, its own src/main/java for version-specific code.
['26.2', '26.3'].each { mc ->
    include "mc$mc"
    project(":mc$mc").projectDir = file("versions/$mc")
}
